# Bronze dataset configuration and contract
project:
  name: ai4i-predictive-maintenance
  description: Binary machine-failure prediction using the AI4I 2020 dataset

paths:
  database: data/project.db
  raw_data: data/raw
  processed_data: data/processed
  artifacts: artifacts
  logs: logs

data:
  adapter: ai4i2020
  source: data/raw/ai4i2020.csv
  format: csv
  entity_id: UDI
  target: Machine failure
  task: binary_classification
  positive_label: 1

# Minimal technical & structural contract for Bronze ingestion
bronze_source_contract:
  rows: 10000
  columns: 14
  col_names:
    - UDI
    - Product ID
    - Type
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
    - Machine failure
    - TWF
    - HDF
    - PWF
    - OSF
    - RNF

  # Semantic column role classification for column_registry
  roles:
    id:
      - UDI
      - Product ID
    feature:
      - Type
      - "Air temperature [K]"
      - "Process temperature [K]"
      - "Rotational speed [rpm]"
      - "Torque [Nm]"
      - "Tool wear [min]"
    target:
      - Machine failure
    outcome:
      - TWF
      - HDF
      - PWF
      - OSF
      - RNF

# Business-level validation (enforced downstream in Silver / EDA)
validation:
  required_columns:
    - UDI
    - Product ID
    - Type
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
    - Machine failure
  allowed_target_values: [0, 1]
  require_unique_entity_id: true
  max_missing_rate: 0.0