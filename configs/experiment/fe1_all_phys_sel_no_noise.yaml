# fe1: baseline plus the thermal_power block. Same split, same model, only the features differ.
# Build the set first:  make features BLOCKS="thermal_power"  then paste the printed ID below.
schema_version: 2
experiment_name: fe1_all_phys_sel_no_noise
seed: 42  # model seed; vary this for repeat runs, the split stays fixed

data:
  dataset_name: ai4i  # folder under data/silver/
  dataset_config: configs/ai4i_binary.yaml  # supplies key, target and roles
  silver_dataset_version_id: silver_ds_v1_eaa07364
  feature_set_id: fs_dade8bd0f10b

split:
  method: stratified
  holdout_fraction: 0.2
  n_folds: 5
  seed: 42  # unchanged, so results compare with base_noise

training:
  validation_fraction: 0.2
  refit_rounds_factor: 1.0

metrics:
  primary: pr_auc
  names: []
  alert_rates: []

analysis:
  permutation_importance: true
  permutation_repeats: 10
  permutation_max_rows: 50000
  error_sample_size: 25

model_file: configs/model/xgb.yaml