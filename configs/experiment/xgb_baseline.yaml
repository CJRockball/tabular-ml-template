# Baseline: Silver feature-role columns only, no engineering.
schema_version: 1
experiment_name: xgb_baseline
seed: 42  # model seed; vary this for repeat runs, the split stays fixed

data:
  dataset_name: ai4i  # folder under data/silver/
  dataset_config: configs/ai4i_binary.yaml  # supplies key, target and roles
  silver_dataset_version_id: silver_ds_v1_eaa07364
  feature_set_id: null  # null = Silver feature columns as they are

split:
  method: stratified
  holdout_fraction: 0.2
  n_folds: 5
  seed: 42  # change only to create a new split

metrics:
  primary: pr_auc  # a result key: pr_auc, or e.g. recall_at_5pct
  names: [pr_auc, recall_at_alert_rate]
  alert_rates: [0.05]  # fraction of rows flagged per metric

model_file: configs/model/xgb.yaml
